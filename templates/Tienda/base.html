<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Juegos de mesa{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #242424;
            background: #f7f5f2;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --accent: #8f1838;
            --accent-dark: #71112b;
            --muted: #716b68;
            --line: #e9e2dd;
            --surface: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 78px;
            border-bottom: 1px solid var(--line);
        }

        header a {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.03em;
        }

        a {
            color: var(--accent);
        }

        main {
            min-height: calc(100vh - 150px);
            padding: 3rem 0;
        }

        footer {
            padding: 1.5rem 0;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.9rem;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        h1, h2, h3, p {
            margin-top: 0;
        }

        h1, h2 {
            letter-spacing: -0.04em;
        }

        h1 {
            margin-bottom: 0.75rem;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.1;
        }

        input, select, button {
            font: inherit;
        }

        button, .button {
            display: inline-block;
            border: 0;
            border-radius: 10px;
            padding: 0.8rem 1.1rem;
            color: white;
            background: var(--accent);
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover, .button:hover {
            background: var(--accent-dark);
            box-shadow: 0 6px 16px #8f18382b;
            transform: translateY(-1px);
        }

        input, select {
            min-height: 46px;
            border: 1px solid #dcd4ce;
            border-radius: 10px;
            padding: 0.7rem 0.85rem;
            background: #fff;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #8f18381a;
        }

        .juegos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 245px), 1fr));
            gap: 1.25rem;
            margin-top: 2rem;
        }

        .tarjeta, .panel {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 5px 20px #33201508;
        }

        .tarjeta img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: contain;
            padding: 1rem;
            background: #f4f0ec;
            transition: transform 220ms ease;
        }

        .imagen-sin-portada {
            display: grid;
            width: 100%;
            height: 220px;
            place-items: center;
            color: #b6a8a0;
            background: #f4f0ec;
            font-size: 4rem;
        }

        .tarjeta:hover img {
            transform: scale(1.035);
        }

        .tarjeta-contenido {
            padding: 1.15rem;
        }

        .tarjeta h2 {
            margin: 0.35rem 0 0.65rem;
            font-size: 1.2rem;
        }

        .tarjeta h2 a {
            color: #292321;
            text-decoration: none;
        }

        .tarjeta h2 a:hover {
            color: var(--accent);
        }

        .categoria-etiqueta {
            display: inline-block;
            margin-bottom: 0.45rem;
            border-radius: 999px;
            padding: 0.3rem 0.65rem;
            color: var(--accent);
            background: #f8e9ed;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .precio {
            margin-bottom: 1rem;
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 800;
        }

        .catalogo-encabezado {
            margin-bottom: 2rem;
        }

        .catalogo-encabezado > p, .texto-suave {
            color: var(--muted);
        }

        .filtros {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(200px, 0.65fr) auto;
            gap: 0.75rem;
            align-items: end;
            padding: 1rem;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 5px 20px #33201508;
        }

        .campo-filtro {
            display: grid;
            gap: 0.4rem;
        }

        .campo-filtro label, .formulario label {
            color: #514a47;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .sin-resultados {
            grid-column: 1 / -1;
            padding: 2rem;
            border: 1px dashed #cfc4bd;
            border-radius: 16px;
            color: var(--muted);
            text-align: center;
        }

        .detalle {
            display: grid;
            grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.1fr);
            gap: clamp(2rem, 6vw, 5rem);
            align-items: start;
            padding: clamp(1.25rem, 4vw, 3rem);
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 12px 36px #3320150d;
        }

        .detalle img {
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 14px;
            background: #f4f0ec;
        }

        .volver {
            display: inline-block;
            margin-bottom: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }

        .detalle-descripcion {
            margin: 1.5rem 0;
            color: #5c5551;
            line-height: 1.75;
        }

        .datos-juego {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin: 1.25rem 0 1.75rem;
            padding: 0;
            list-style: none;
        }

        .datos-juego li {
            border-radius: 10px;
            padding: 0.65rem 0.8rem;
            background: #f7f5f2;
            color: #514a47;
            font-size: 0.9rem;
        }

        .seccion-pedido {
            margin-top: 2rem;
            border-top: 1px solid var(--line);
            padding-top: 1.5rem;
        }

        .formulario {
            display: grid;
            gap: 0.6rem;
            max-width: 560px;
        }

        .formulario h2 {
            margin-bottom: 0.5rem;
        }

        .formulario input, .formulario select {
            width: 100%;
        }

        .agotado {
            display: inline-block;
            border-radius: 999px;
            padding: 0.55rem 0.8rem;
            color: #7a3030;
            background: #f9e9e7;
            font-weight: 700;
        }

        .panel {
            max-width: 680px;
            margin: 0 auto;
            padding: clamp(1.5rem, 5vw, 3rem);
        }

        .panel dl {
            display: grid;
            grid-template-columns: minmax(130px, 0.7fr) 1fr;
            gap: 0.85rem 1rem;
            margin: 2rem 0;
        }

        .panel dt {
            color: var(--muted);
        }

        .panel dd {
            margin: 0;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        @media (max-width: 640px) {
            body {
                padding: 0 1rem;
            }

            main {
                padding: 2rem 0;
            }

            .filtros {
                grid-template-columns: 1fr;
            }

            .detalle {
                grid-template-columns: 1fr;
            }

            .detalle img {
                max-height: 340px;
            }

            .imagen-sin-portada {
                height: 260px;
            }

            .panel dl {
                grid-template-columns: 1fr;
                gap: 0.25rem;
            }

            .panel dd {
                margin-bottom: 0.75rem;
            }
        }
    </style>
    {% block estilos %}{% endblock %}
</head>
<body>
    <header>
        <a href="{% url 'catalogo' %}"><span aria-hidden="true">◆</span> Juegos de mesa</a>
        <a href="{% url 'catalogo' %}">Explorar catálogo</a>
    </header>

    <main>
        {% block contenido %}{% endblock %}
    </main>

    <footer>
        <small>Tienda de juegos de mesa</small>
    </footer>
</body>
</html>
